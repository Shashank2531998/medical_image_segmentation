dataset:
  name: aeropath
  train_root: ./data/AeroPath/
  val_fraction: 0.2
  seed: 42
  batch_size: 1
  num_workers: 0
  patch_size: [192, 192, 192]

model:
  dir: ./models/voxtell_v1.1

training:
  epochs: 1
  device: cpu
  deep_supervision: false
  optimizer:
    lr: 1e-4
  output_dir: ./experiments/exp_debug
  debug_save_artifacts: true
  debug_save_interval: 1
