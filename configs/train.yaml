dataset:

  name: aeropath
  root: ./data/AeroPath/
  seed: 42
  batch_size: 1
  patch_size: [192, 192, 192]
  train_fraction: 0.8
  val_fraction: 0.2

model:
  dir: ./models/voxtell_v1.1
  device: cuda
  deep_supervision: false
  reinit_weights: false

training:
  epochs: 10
  seed: 42
  use_deterministic_algorithms: true
  optimizer:
    lr: 0.0001
    weight_decay: 0.00003
    momentum: 0.99
    poly_power: 1.0
    nesterov: true
  output_dir: ./experiments/fine_tuning/aeropath
